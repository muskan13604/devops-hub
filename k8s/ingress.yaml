apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devopshub-ingress
  namespace: devops
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: devopshub.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: devopshub-backend-service
            port:
              number: 80
