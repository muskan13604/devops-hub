services:
  mongodb:
    image: mongo:latest
    container_name: devopshub_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devopshub_backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=devopshub-ai
      - CLIENT_ORIGIN=http://localhost
      - JWT_ACCESS_SECRET=change-this-to-a-long-random-access-secret-before-production
      - JWT_REFRESH_SECRET=change-this-to-a-long-random-refresh-secret-before-production
    volumes:
      # Mount the Docker socket so the backend can execute Docker commands!
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the backend directory for hot-reloading in dev
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devopshub_frontend
    environment:
      - VITE_API_URL=/api
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: devopshub_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: devopshub_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
