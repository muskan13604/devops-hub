version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: devopshub_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devopshub_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/devopshub
      - JWT_SECRET=super_secret_key_change_me_in_production
      - FRONTEND_URL=http://localhost
    volumes:
      # Mount the Docker socket so the backend can execute Docker commands!
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the backend directory for hot-reloading in dev
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devopshub_frontend
    environment:
      - VITE_API_URL=/api
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: devopshub_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
